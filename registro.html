<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear cuenta — Vitrina</title>
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="encabezado">
    <div class="contenedor">
      <a class="marca" href="index.html">Vitrina<span class="punto">.</span></a>
      <div class="nav-usuario" id="nav-usuario"></div>
    </div>
  </header>

  <div class="pantalla-centrada">
    <div class="tarjeta" style="width:100%; max-width:460px;">
      <h2>Crear cuenta</h2>
      <p style="margin-top:-8px; opacity:0.7; font-size:0.9rem;">Elige cómo quieres usar la plataforma. Podrás verificar tu identidad después.</p>

      <form class="formulario" id="form-registro" style="margin-top:16px;">
        <div id="zona-mensaje"></div>

        <div class="campo">
          <label for="rol">Quiero registrarme como</label>
          <select id="rol" required>
            <option value="cliente">Cliente — quiero comprar o pedir servicios</option>
            <option value="vendedor">Vendedor — quiero vender productos</option>
            <option value="proveedor_servicio">Prestador de servicios</option>
            <option value="repartidor">Repartidor — quiero hacer entregas</option>
          </select>
        </div>

        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required />
        </div>

        <div class="campo">
          <label for="cedula">Carnet de identidad</label>
          <input type="text" id="cedula" required />
        </div>

        <div class="campo">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" required />
        </div>

        <div class="campo">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="6" autocomplete="new-password" />
        </div>

        <button class="boton boton-primario boton-ancho" type="submit">Crear cuenta</button>
      </form>

      <p style="margin-top:16px; font-size:0.9rem;">
        ¿Ya tienes cuenta? <a href="login.html">Entra aquí</a>
      </p>
    </div>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    pintarBarraUsuario();

    document.getElementById("form-registro").addEventListener("submit", async (e) => {
      e.preventDefault();
      const zona = document.getElementById("zona-mensaje");
      zona.innerHTML = "";

      const datos = {
        rol: document.getElementById("rol").value,
        nombre: document.getElementById("nombre").value.trim(),
        cedula: document.getElementById("cedula").value.trim(),
        telefono: document.getElementById("telefono").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
      };

      try {
        await registrarUsuario(datos);
        zona.innerHTML = `<p class="mensaje-exito">Cuenta creada. Revisa tu correo para confirmarla y luego inicia sesión.</p>`;
        setTimeout(() => (window.location.href = "login.html"), 2200);
      } catch (err) {
        zona.innerHTML = `<p class="mensaje-error">${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
